};
const frame = document.getElementById('study-page');
const buttons = [...document.querySelectorAll('[data-page]')];
let resizeObserver;
function decodePage(encoded) {
  const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function showPage(name) {
  const isKobun = name === 'kobun';
  frame.title = isKobun ? '古文助動詞' : '漢文句法';
  buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.page === name)));
  frame.srcdoc = decodePage(pages[name]);
}
frame.addEventListener('load', () => {
  if (resizeObserver) resizeObserver.disconnect();
  const doc = frame.contentDocument;
  if (!doc) return;
  const resize = () => {
    frame.style.height = `${Math.max(doc.documentElement.scrollHeight, doc.body?.scrollHeight || 0)}px`;
  };
  resizeObserver = new ResizeObserver(resize);
  resizeObserver.observe(doc.documentElement);
  if (doc.body) resizeObserver.observe(doc.body);
  resize();
});
buttons.forEach(button => button.addEventListener('click', () => showPage(button.dataset.page)));
showPage('kobun');
</script>
